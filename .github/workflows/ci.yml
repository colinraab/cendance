name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 arm64 Release
            runner: macos-15
            build_type: Release
            deployment_target: "15.0"
          - name: macOS 15 Intel Release
            runner: macos-15-intel
            build_type: Release
            deployment_target: "15.0"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: brew install libsodium ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}

      - name: Build
        run: cmake --build build --parallel 3

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build release archive
        run: cmake --build build --target package --parallel 3

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cendance-${{ runner.os }}-${{ runner.arch }}
          path: build/cendance-*.tar.gz
          if-no-files-found: error
          retention-days: 14
